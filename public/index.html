<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KidsCare · School QR & Messaging</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#05060f">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--c1:#fbbf24;--c2:#fb7185}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
body{margin:0;min-height:100vh;background:#05060f;color:#e6f1ff;font-family:system-ui,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(circle at 15% 10%,rgba(251,191,36,.16),transparent 40%),radial-gradient(circle at 85% 90%,rgba(244,114,182,.18),transparent 45%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#05060f;z-index:60}
/* loading bar */
#bar{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;width:100%;z-index:70;opacity:0;transform:scaleX(.15);transform-origin:left;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200% 100%;transition:opacity .2s,transform .6s}
body.busy #bar{opacity:1;transform:scaleX(1);animation:slide 1.1s linear infinite}
body.busy .btn{opacity:.75}
/* cards */
.glass{background:rgba(255,255,255,.045);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(251,191,36,.26);border-radius:1rem;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 30px rgba(0,0,0,.25);transition:transform .25s ease,border-color .25s,box-shadow .25s}
.glass:hover{border-color:rgba(244,114,182,.55);box-shadow:0 10px 36px rgba(251,191,36,.1)}
.glass.item:hover{transform:translateY(-2px)}
.neon{color:#fcd34d;text-shadow:0 0 12px rgba(251,191,36,.55)}
.brand-mark{display:block;width:3rem;height:3rem;margin:0 auto .6rem;border-radius:.9rem;background:linear-gradient(135deg,#fbbf24,#6366f1);box-shadow:0 0 24px rgba(251,191,36,.45)}
.avatar{flex:none;width:2.5rem;height:2.5rem;border-radius:.75rem;display:grid;place-items:center;font-weight:700;font-size:.8rem;letter-spacing:.03em;color:#fde68a;background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(244,114,182,.25));border:1px solid rgba(251,191,36,.35)}
/* header: unified top controls (status, user, logout) */
.topctl{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:2.35rem;padding:0 .8rem;border-radius:.7rem;border:1px solid rgba(148,163,184,.32);background:rgba(255,255,255,.05);color:#cbd5e1;font-size:.78rem;font-weight:600;line-height:1;white-space:nowrap;transition:border-color .2s,background .2s,color .2s,box-shadow .2s,transform .15s}
.topctl:hover{color:#fcd34d;border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.08)}
.topctl:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.topctl.ok{color:#6ee7b7;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.12)}
.topctl.ok::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.topctl.off{color:#fca5a5;border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.1)}
.topctl.off::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:#f43f5e;box-shadow:0 0 8px #f43f5e}
.topinput{height:2.35rem;padding:0 .8rem;border-radius:.7rem;border:1px solid rgba(148,163,184,.32);background:rgba(255,255,255,.05);color:#e2e8f0;font-size:.8rem;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.topinput::placeholder{color:#94a3b8}
.topinput:focus{border-color:var(--c1);background:rgba(251,191,36,.05);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.uchip{display:inline-flex;align-items:center;gap:.55rem;height:2.35rem;padding:.2rem .7rem .2rem .28rem;border-radius:.7rem;border:1px solid rgba(148,163,184,.3);background:rgba(255,255,255,.05);min-width:0;max-width:15rem;transition:border-color .25s,box-shadow .25s,background .25s}
.uchip .avatar{width:1.9rem;height:1.9rem;border-radius:.5rem;font-size:.7rem}
.uchip .uname{font-weight:600;font-size:.8rem;line-height:1.15;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9.5rem}
.uchip .urole{display:flex;align-items:center;gap:.22rem;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.1;margin-top:.12rem;white-space:nowrap}
.uchip .urole svg{width:.72rem;height:.72rem;flex:none}
.uchip.admin{border-color:rgba(251,191,36,.45);background:linear-gradient(135deg,rgba(251,191,36,.13),rgba(244,114,182,.06))}
.uchip.admin:hover{border-color:rgba(251,191,36,.8);box-shadow:0 0 20px rgba(251,191,36,.18)}
.uchip.admin .urole{color:#fcd34d}
.uchip.parent{border-color:rgba(244,114,182,.45);background:linear-gradient(135deg,rgba(244,114,182,.13),rgba(99,102,241,.08))}
.uchip.parent:hover{border-color:rgba(244,114,182,.8);box-shadow:0 0 20px rgba(244,114,182,.18)}
.uchip.parent .urole{color:#f9a8d4}
.logout-btn{gap:.42rem;white-space:nowrap;cursor:pointer}
.logout-btn svg{width:1rem;height:1rem;flex:none;transition:transform .2s}
.logout-btn:hover svg{transform:translateX(2px)}
@media (max-width:640px){
 .topctl{height:2.2rem;padding:0 .6rem;font-size:.72rem}
 .topinput{height:2.2rem;padding:0 .65rem;font-size:.75rem}
 .uchip{height:2.2rem;max-width:11rem;padding-right:.55rem}
 .uchip .uname{max-width:5.5rem;font-size:.74rem}
 .uchip .avatar{width:1.7rem;height:1.7rem;font-size:.64rem}
}
/* buttons */
.btn,.btn2{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;font-size:.875rem;line-height:1.25;border-radius:.65rem;padding:.65rem 1.1rem;border:1px solid transparent;cursor:pointer;user-select:none;transition:transform .15s ease,background .2s,border-color .2s,box-shadow .2s,color .2s,opacity .2s,filter .2s}
.btn{color:#fff;background:linear-gradient(135deg,#f59e0b,#ec4899);border-color:rgba(255,255,255,.22);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 18px rgba(245,158,11,.25)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 10px 24px rgba(236,72,153,.35)}
.btn2{color:#cbd5e1;background:rgba(255,255,255,.04);border-color:rgba(148,163,184,.35)}
.btn2:hover{color:#fcd34d;border-color:var(--c1);background:rgba(251,191,36,.08);transform:translateY(-1px)}
.btn:active,.btn2:active{transform:translateY(0) scale(.98);filter:brightness(.95)}
.btn-danger{color:#fda4af;border-color:rgba(244,63,94,.5)}
.btn-danger:hover{color:#fecdd3;border-color:#f43f5e;background:rgba(244,63,94,.14)}
.btn-solid-danger{background:linear-gradient(135deg,#e11d48,#be123c);border-color:rgba(255,255,255,.2);box-shadow:0 6px 18px rgba(225,29,72,.25)}
.btn-sm{padding:.35rem .75rem;font-size:.75rem;border-radius:.5rem}
.btn:focus-visible,.btn2:focus-visible,.tabb:focus-visible,.seg button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.btn[disabled],.btn2[disabled]{opacity:.55;pointer-events:none}
/* tabs, chips, segmented control */
.tabb{display:inline-flex;align-items:center;justify-content:center;min-height:2.35rem;padding:0 1rem;border-radius:.7rem;border:1px solid transparent;white-space:nowrap;color:#94a3b8;font-weight:600;font-size:.8rem;transition:color .2s,background .2s,border-color .2s}
.tabb:hover{color:#e2e8f0;background:rgba(255,255,255,.06)}
.tabb.on{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4)}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem;border-radius:99px;font-size:.75rem;border:1px solid rgba(148,163,184,.35);background:rgba(255,255,255,.05);transition:.2s}
.chip.on{background:rgba(251,191,36,.18);border-color:var(--c1);color:#fde68a}
.chip.ok{border-color:#34d399;background:rgba(52,211,153,.14);color:#6ee7b7}
.chip.ok::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.dot{display:inline-block;width:.5rem;height:.5rem;margin-right:.4rem;border-radius:50%;background:#f43f5e;box-shadow:0 0 8px #f43f5e;animation:pulse 1.6s infinite}
.seg{display:inline-flex;padding:.2rem;gap:.15rem;border:1px solid rgba(148,163,184,.3);border-radius:.7rem;background:rgba(255,255,255,.04)}
.seg button{padding:.45rem 1.2rem;border-radius:.5rem;font-size:.85rem;font-weight:600;color:#94a3b8;transition:.2s}
.seg button:hover{color:#e2e8f0}
.seg button.on{color:#fff;background:linear-gradient(135deg,#f59e0b,#ec4899);box-shadow:0 4px 14px rgba(245,158,11,.3)}
/* floating-label fields */
.fl{position:relative;margin-bottom:.9rem}
.fl input,.fl select,.fl textarea{width:100%;padding:1.25rem .8rem .45rem;background:rgba(255,255,255,.05);border:1px solid rgba(148,163,184,.3);border-radius:.7rem;color:#fff;outline:0;transition:border-color .2s,box-shadow .2s,background .2s}
.fl select option{background:#0b1020}
.fl label{position:absolute;left:.8rem;top:.95rem;font-size:.85rem;color:#94a3b8;transition:.2s;pointer-events:none}
.fl input:focus+label,.fl input:not(:placeholder-shown)+label,.fl textarea:focus+label,.fl textarea:not(:placeholder-shown)+label,.fl input[type=date]+label,.fl select+label{top:.3rem;font-size:.65rem;color:var(--c1)}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--c1);background:rgba(251,191,36,.05);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.fl.bad input{border-color:#f43f5e}.fl.ok input{border-color:#34d399}
.err{color:#fb7185;font-size:.7rem;margin:.15rem 0 0 .3rem}
/* chat */
.bub{max-width:80%;padding:.45rem .8rem;border-radius:1rem;font-size:.85rem;animation:pop .25s}
.bub.me{margin-left:auto;background:linear-gradient(90deg,#f59e0b,#db2777);border-bottom-right-radius:.2rem}
.bub.them{background:rgba(255,255,255,.1);border-bottom-left-radius:.2rem}
/* motion */
.fade{animation:fade .45s ease both}.float{animation:float 3s ease-in-out infinite}.shake{animation:shake .4s}
.item{animation:rise .4s ease both}
.item:nth-child(2){animation-delay:.04s}.item:nth-child(3){animation-delay:.08s}.item:nth-child(4){animation-delay:.12s}.item:nth-child(5){animation-delay:.16s}.item:nth-child(n+6){animation-delay:.2s}
.leaving{opacity:0!important;transform:translateX(14px) scale(.98)!important;transition:opacity .25s,transform .25s;pointer-events:none}
.skel{height:5rem;border-radius:1rem;margin-bottom:.75rem;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.2s infinite}
.zoom{display:block;overflow:hidden;border-radius:.6rem}.zoom img{transition:transform .35s ease;border-radius:.6rem}.zoom:hover img{transform:scale(1.05)}
.modal-bg{animation:bgin .2s ease both}.modal-bg.out{opacity:0;transition:opacity .18s}.modal-bg.out>.glass{transform:scale(.96);transition:transform .18s}
#toasts{position:fixed;right:.75rem;top:calc(.75rem + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;gap:.5rem;max-width:calc(100% - 1.5rem);width:22rem}
#toasts>*{animation:toastin .3s ease both}#toasts>.out{opacity:0;transform:translateX(16px);transition:opacity .25s,transform .25s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes bgin{from{opacity:0}to{opacity:1}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes slide{to{background-position:-200% 0}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.dropzone{display:block;text-align:center;padding:1.4rem 1rem;border:2px dashed rgba(251,191,36,.45);border-radius:.9rem;cursor:pointer;background:rgba(251,191,36,.04);transition:border-color .2s,background .2s,transform .2s}
.dropzone:hover,.dropzone.over{border-color:#fbbf24;background:rgba(251,191,36,.1);transform:translateY(-1px)}
.qpanel{display:none}.qpanel.open{display:block;animation:fade .3s ease both}
.chev{transition:transform .25s}.expanded .chev{transform:rotate(180deg)}
.pdot{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:#64748b}.pdot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.wordmark{background:linear-gradient(90deg,#fde68a,#fdba74 45%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.logo-glow svg{display:block;filter:drop-shadow(0 6px 22px rgba(251,191,36,.5))}
#authcard{background-image:radial-gradient(circle at 50% -8%,rgba(251,191,36,.2),transparent 55%)}
.bar{height:.5rem;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f472b6);transition:width .6s ease}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;text-align:center;color:#000}body{background:#fff}}
</style>
</head>
<body>
<div id="bar"></div><div id="app"></div><div id="toasts"></div><div id="modal"></div><div id="printArea"></div>
<script>
/* ===== Logo, offline storage (IndexedDB) and sync queue ===== */
const logo=s=>`<svg viewBox="0 0 48 48" width="${s}" height="${s}" role="img" aria-label="KidsCare logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#lg)"/><path d="M24 8.5 7.5 22.5c-.7.6-.3 1.8.7 1.8H11V38c0 1.7 1.3 3 3 3h20c1.7 0 3-1.3 3-3V24.3h2.8c1 0 1.4-1.2.7-1.8z" fill="#fff"/><circle cx="22" cy="26" r="4.2" fill="#f43f5e"/><path d="M14.5 37.5c0-4.3 3.2-7 7.5-7s7.5 2.7 7.5 7z" fill="#f43f5e"/><circle cx="37" cy="37" r="7" fill="#22c55e" stroke="#fff" stroke-width="2"/><path d="m33.6 37 2.4 2.4 4.2-4.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const online=new Set();   // parent ids that are online (admin Inbox)
let staffPresence={online:false,count:0,names:[]};   // teacher/admin online status (parent view)
const staffChip=()=>staffPresence.online
 ?`<span class="topctl ok">${staffPresence.count>1?staffPresence.count+' staff online':'Teacher online'}</span>`
 :'<span class="topctl"><span class="pdot"></span>Teacher offline</span>';
function drawStaffPresence(){const a=$('#staffchip');if(a)a.innerHTML=staffChip();const b=$('#teacherStatus');if(b)b.innerHTML=staffChip()}
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('kidscare',1);r.onupgradeneeded=()=>{r.result.createObjectStore('cache');r.result.createObjectStore('queue',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(s,m,f)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
 return{get:k=>tx('cache','readonly',s=>s.get(k)),set:(k,v)=>tx('cache','readwrite',s=>s.put(v,k)),clear:()=>tx('cache','readwrite',s=>s.clear()),
  add:v=>tx('queue','readwrite',s=>s.add(v)),all:()=>tx('queue','readonly',s=>s.getAll()),del:k=>tx('queue','readwrite',s=>s.delete(k))}})();
// Saves an action while offline; flush() sends it when the connection returns
async function queue(kind,path,payload){await idb.add({uid:cur.id,kind,path,...payload,t:Date.now()});netUI();navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.sync&&r.sync.register('kc-sync')).catch(()=>{})}
let flushing=false;
async function flush(){if(flushing||!navigator.onLine||!cur||!api.token)return;flushing=true;let n=0;
 try{for(const it of (await idb.all()).filter(i=>i.uid===cur.id)){
   try{let body=it.json;if(!body){body=new FormData();Object.entries(it.fields).forEach(([k,v])=>body.append(k,v));(it.files||[]).forEach((b,i)=>body.append('photos',b,'photo'+i+'.jpg'))}
    await api.req(it.path,{method:'POST',body});await idb.del(it.id);n++}
   catch(e){if(e.net)break;await idb.del(it.id);toast('A queued '+it.kind+' was rejected: '+e.message,'bad')}}}
 finally{flushing=false}
 if(n){toast('Synced '+n+' offline item(s)');try{await refresh()}catch(e){}if(tab==='scan')renderLog();if(tab==='chat'||(tab==='inbox'&&thread))openThread(cur.role==='parent'?'me':thread);if(tab==='photo')loadPosts()}
 netUI()}
async function netUI(){const e=$('#net');if(!e)return;const n=cur?(await idb.all().catch(()=>[])).filter(i=>i.uid===cur.id).length:0;e.classList.toggle('ok',navigator.onLine);e.classList.toggle('off',!navigator.onLine);e.textContent=(navigator.onLine?'Online':'Offline')+(n?' · '+n+' pending':'')}
/* ===== Helpers: loading state + initials ===== */
let _busy=0;const busy=n=>{_busy+=n;document.body.classList.toggle('busy',_busy>0)};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
/* ===== API + local cache (data now comes from the Node server) ===== */
const api={token:localStorage.getItem('kc_token'),
 setToken(t){this.token=t;t?localStorage.setItem('kc_token',t):localStorage.removeItem('kc_token')},
 async req(p,o={}){const f=o.body instanceof FormData,h={},isGet=!o.method||o.method==='GET',ck=(cur?cur.id:'')+p;if(!f)h['Content-Type']='application/json';if(this.token)h.Authorization='Bearer '+this.token;
  busy(1);
  try{let r;
   try{r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body&&!f?JSON.stringify(o.body):o.body})}
   catch(e){if(isGet){const c=await idb.get(ck).catch(()=>undefined);if(c!==undefined)return c}const er=new Error('You are offline');er.net=true;throw er}
   const d=await r.json().catch(()=>({}));
   if(r.status===401&&this.token&&!p.startsWith('/login')&&!p.startsWith('/signup'))setTimeout(()=>logout(),0);
   if(!r.ok)throw new Error(d.error||'Something went wrong, please try again');
   if(isGet)idb.set(ck,d).catch(()=>{});return d}
  finally{busy(-1)}}};
let db={users:[],children:[],photos:[],feed:[],scans:[],msgs:[],mail:[]},cur=null,socket=null,loadedCid=null,pendingBlob=null;
const ts=s=>new Date(String(s).replace(' ','T')+'Z').getTime();
const userFromToken=t=>{try{const p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return{id:p.id,role:p.role,name:p.name}}catch(e){return null}};
const mapMsg=m=>({id:m.id,parentId:String(m.parent_id),from:m.sender_role,name:m.sender_name,text:m.text,t:ts(m.created_at)});
const qrOf=id=>qrPng('KIDSCARE:'+db.children.find(c=>c.id==id).token);
// Kinukuha ang bata/photos sa server at inaayos sa hugis na gamit ng mga view
async function refresh(){
 const ch=await api.req('/children');
 db.children=ch.map(c=>({id:String(c.id),parentId:String(c.parent_id),name:c.name,address:c.address,age:c.age,dob:c.dob,phone:c.phone,allergies:c.allergies,status:c.status,token:c.qr_token,code:c.student_code,classroom:c.classroom||'',medical:c.medical_notes,emName:c.emergency_name,emPhone:c.emergency_phone,pname:c.parent_name,pemail:c.parent_email}));
 if(cur.role==='admin'){db.users=(await api.req('/parents')).map(p=>({id:String(p.id),role:'parent',name:p.name,email:p.email}));await loadScans()}
 else db.feed=(await api.req('/feed')).map(a=>({id:a.id,kind:a.kind,title:a.title,body:a.body,t:ts(a.created_at),photos:a.photos}));
}
async function loadScans(){try{db.scans=await api.req('/scans')}catch(e){db.scans=[]}if(tab==='scan')renderLog()}
// Real-time (Socket.IO): chat at status updates
function connect(){
 if(socket)socket.disconnect();
 if(typeof io==='undefined')return;socket=io({auth:{token:api.token}});
 // Chat: show live if that thread is open, otherwise flag it as unread
 socket.on('message',m=>{const pid=String(m.parent_id),open=(cur.role==='parent'&&tab==='chat')||(cur.role==='admin'&&tab==='inbox'&&thread===pid);
  if(open){if(!db.msgs.some(x=>x.id===m.id))db.msgs.push(mapMsg(m));drawChat()}
  else if(m.sender_role!==cur.role){unread[pid]=1;toast('New message from '+m.sender_name);if(tab==='inbox')drawPlist()}});
 socket.on('presence:list',l=>{online.clear();l.forEach(i=>online.add(String(i)));if(tab==='inbox')drawPlist()});
 socket.on('presence',p=>{p.online?online.add(String(p.id)):online.delete(String(p.id));if(tab==='inbox')drawPlist()});
 // Teacher/admin presence: parents see if someone is online to reply
 socket.on('staff:presence',p=>{staffPresence=p||{online:false,count:0,names:[]};drawStaffPresence()});
 // QR scan result
 socket.on('status',s=>{const c=db.children.find(c=>c.id===String(s.childId));if(!c)return;c.status=s.status;
  if(cur.role==='admin')loadScans();
  else db.mail.unshift({id:uid(),childId:c.id,t:Date.now(),subject:c.name+(s.status==='at_school'?' timed in at school':' timed out of school'),body:'Check-in recorded at '+fmt(Date.now())+'. A notification email was sent to your Gmail.'});
  if(tab==='students')view();refreshStatus()});
 socket.on('children-changed',()=>{refresh().then(()=>{if(tab==='scan')renderLog();else if(['students','parents','qr'].includes(tab))view()})});
 socket.on('feed-changed',()=>{if(cur.role!=='parent')return;refresh().then(()=>{if(tab==='photos')view()})});
 // New classroom activity / announcement
 socket.on('activity',()=>{if(cur.role!=='parent')return;toast('New update from school');refresh().then(()=>{if(tab==='photos')view()})});
}

 d.innerHTML=`<div class="text-xs text-slate-400">Email notification</div><div class="text-xs">To: ${esc(m.to)}</div><div class="font-semibold mt-1">${esc(m.subject)}</div><div class="text-slate-300 text-xs mt-1">${esc(m.body)}</div>`;

/* ===== Validation ===== */
const rules={req:v=>v.trim()?'':'Required',email:v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?'':'Enter a valid email',pw:v=>v.length>=6?'':'At least 6 characters',phone:v=>/^[\d+\s-]{7,15}$/.test(v)?'':'Enter a valid number',match:v=>v===$('#pw').value?'':'Passwords don’t match'};
function chk(el){const r=el.dataset.rule;if(!r)return true;const m=rules[r](el.value),p=el.parentElement;p.classList.toggle('bad',!!m);p.classList.toggle('ok',!m&&!!el.value);p.querySelector('.err').textContent=m;return !m}
const chkAll=sel=>[...document.querySelectorAll(sel+' [data-rule]')].map(chk).every(Boolean);
const fl=(id,label,type='text',rule='req',extra='')=>`<div class="fl"><input id="${id}" type="${type}" placeholder=" " data-rule="${rule}" oninput="chk(this)" onblur="chk(this)" autocomplete="off" ${extra}><label>${label}</label><p class="err"></p></div>`;

function authView(){
 $('#app').innerHTML=`<main class="min-h-screen grid place-items-center p-4"><div id="authcard" class="glass fade w-full max-w-md p-6">

 <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-white/5 mb-4">${['login','signup'].map(m=>`<button class="tabb ${mode===m?'on':''}" onclick="mode='${m}';authView()">${m==='login'?'Log in':'Sign up'}</button>`).join('')}</div>

 try{await afterAuth(await api.req('/login',{method:'POST',body:{email:$('#em').value,password:$('#pw').value,role}}))}catch(err){toast(err.message,'bad');bad()}}

 try{const d=await api.req('/signup',{method:'POST',body:{name:$('#nm').value,email:$('#em').value,password:$('#pw').value}});toast('Welcome aboard, '+d.user.name+'!');await afterAuth(d)}catch(err){toast(err.message,'bad');bad()}}
function logout(){stopScan();api.setToken(null);cur=null;loadedCid=null;chatCid=null;thread=null;unread={};if(socket){socket.disconnect();socket=null}db={users:[],children:[],photos:[],feed:[],scans:[],msgs:[],mail:[]};closeModal();idb.clear().catch(()=>{});mode='login';authView()}

   <button class="topctl logout-btn" onclick="logout()" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span class="hidden sm:inline">Log out</span></button>
  </div>
  </div>
  <nav class="tabs max-w-6xl mx-auto px-3 pb-2 flex gap-1 overflow-x-auto">${TABS[u.role].map(t=>`<button class="tabb ${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</nav></header>
  <main id="view" class="max-w-6xl mx-auto p-3 sm:p-5"></main>`;view();netUI()}

 if(tab==='qr')afterQr();if(tab==='scan')renderLog();if(tab==='chat')openThread('me');if(tab==='inbox')inboxInit();if(tab==='reports')loadReport();if(tab==='attendance')loadAttendance();if(tab==='photo'){audOpts();loadPosts()}}

 ${fl('cp','Contact number (parent / guardian)','tel','phone')}${fl('cm','Medical / emergency notes (optional)','text','')}
 <div class="fl"><input id="tg" placeholder=" " onkeydown="tagKey(event)"><label>Allergies (press Enter to add)</label></div><div id="tagbox" class="mb-3"></div>
 <button class="btn w-full">Save child & generate QR</button></form>
 <div class="glass p-5"><h2 class="text-lg font-bold neon mb-3">My children</h2>${kids.length?kids.map(c=>`<div id="kid-${c.id}" class="item p-3 mb-2 rounded-xl bg-white/5 flex flex-wrap items-center gap-3"><div class="avatar">${initials(c.name)}</div><div class="flex-1"><div class="font-semibold">${esc(c.name)}</div><div class="text-xs text-slate-400">Age ${esc(c.age)} · ${c.allergies.length?esc(c.allergies.join(', ')):'No allergies'}</div></div>${badge(c)}<button class="btn2 btn-danger btn-sm" onclick="delChild('${c.id}')">Delete</button></div>`).join(''):'<p class="text-slate-400 text-sm">No children yet. Fill in the form to add one.</p>'}</div></div>`}

/* ===== QR + chat ===== */
function qrPng(text){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),s=10,m=20,c=document.createElement('canvas');c.width=c.height=n*s+2*m;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#0b1020';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(m+k*s,m+r*s,s,s);return c.toDataURL('image/png')}
function qrView(){const kids=mine();if(!kids.length)return `<div class="glass p-8 text-center"><p class="text-slate-300 mb-3">Add a child first to get a QR pass.</p><button class="btn" onclick="setTab('add')">Add child</button></div>`;
 return `<h2 class="text-lg font-bold neon mb-1">QR pass</h2><p class="text-xs text-slate-400 mb-3">Tap a child's name to show their QR code.</p><div class="grid gap-2 max-w-xl">${kids.map(k=>`<div id="kq-${k.id}" class="glass item overflow-hidden"><button class="w-full flex items-center gap-3 p-3 text-left" onclick="toggleKid('${k.id}')"><div class="avatar">${initials(k.name)}</div><div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(k.name)}</div><div class="text-xs text-slate-400">${esc(k.code)}</div></div>${badge(k)}<span class="chev text-slate-400">&#9662;</span></button><div id="qp-${k.id}" class="qpanel p-4 pt-0 text-center"></div></div>`).join('')}</div>`}
function toggleKid(id){const p=$('#qp-'+id),open=!p.classList.contains('open');
 document.querySelectorAll('.qpanel.open').forEach(x=>{x.classList.remove('open');x.parentElement.classList.remove('expanded')});
 if(open){const c=db.children.find(c=>c.id===id);p.innerHTML=`<img src="${qrOf(id)}" alt="QR code for ${esc(c.name)}" class="mx-auto w-52 h-52 rounded-xl shadow-[0_0_30px_rgba(251,191,36,.4)]"><div class="flex flex-wrap gap-2 justify-center mt-3"><button class="btn" onclick="dlQr('${id}')">Download</button><button class="btn2" onclick="printQr('${id}')">Print</button></div>`;p.classList.add('open');p.parentElement.classList.add('expanded')}}

function chatView(){return `<div class="glass p-4 flex flex-col max-w-2xl mx-auto"><div class="flex items-center justify-between gap-2 mb-1"><h2 class="font-bold neon">Messages</h2><span id="teacherStatus">${staffChip()}</span></div><p class="text-xs text-slate-400 mb-3">Private chat between you and your child’s teacher / school admin. ${staffPresence.online?'Someone is online now and can reply.':'No one is online right now — your message will still be delivered.'}</p>${chatBox('Message the teacher…')}</div>`}

function scanView(){return `<div class="grid lg:grid-cols-2 gap-4"><div class="glass p-5"><h2 class="font-bold neon mb-3">QR scanner</h2>

 <div class="flex flex-wrap gap-2 mt-3"><button class="btn" onclick="startScan()">Start camera</button><button class="btn2" onclick="stopScan()">Stop</button></div>
 <label class="dropzone mt-4" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropQr(event)"><input type="file" accept="image/*" class="hidden" onchange="scanFile(this.files[0]);this.value=''"><div class="font-semibold">Upload QR Image</div><div class="text-xs text-slate-400 mt-1">Drag a photo or screenshot here, or click to browse</div></label><div id="qrfile" class="hidden"></div></div>
 <div class="glass p-5"><h2 class="font-bold neon mb-3">Recent check-ins</h2><div id="log" class="space-y-2 text-sm"></div></div></div>`}
function dropQr(e){e.preventDefault();e.currentTarget.classList.remove('over');scanFile(e.dataTransfer.files[0])}
// Uploaded image: decode, then ask the admin to confirm before anything is sent
async function scanFile(f){if(!f)return;let txt;
 try{txt=await new Html5Qrcode('qrfile').scanFile(f,false)}catch(e){return toast('No QR code found in that image','bad')}
 const raw=String(txt).replace('KIDSCARE:',''),c=db.children.find(c=>c.token===raw||c.id===raw);
 if(!c)return toast('This QR code is not recognised','bad');
 const when=new Date(),tin=scanMode==='arrival',row=(k,v)=>`<div class="flex justify-between gap-3 py-1 border-b border-white/5"><span class="text-slate-400">${k}</span><span class="text-right">${v}</span></div>`;
 askConfirm('Confirm scan',null,()=>handleScan(txt,when.toISOString()),'Confirm Scan & Notify',`<div class="text-sm mb-4">${row('Pupil','<b>'+esc(c.name)+'</b>')}${row('Pupil ID',esc(c.code))}${row('Parent',esc(c.pname))}${row('Contact number',esc(c.phone))}${row('Action','<b>'+(tin?'Time In':'Time Out')+'</b>')}${row('Time',when.toLocaleString())}</div>`)}
function startScan(){stopScan();if(typeof Html5Qrcode==='undefined')return toast('Scanner library unavailable – use the simulator','bad');
 scanner=new Html5Qrcode('reader');$('#reader').innerHTML='';
 scanner.start({facingMode:'environment'},{fps:10,qrbox:200},t=>{if(Date.now()-lastScan<4000)return;lastScan=Date.now();handleScan(t)},()=>{}).catch(()=>{scanner=null;$('#reader').textContent='Camera unavailable';toast('Camera unavailable – use the simulator','bad')})}
function stopScan(){if(scanner){const s=scanner;scanner=null;s.stop().then(()=>s.clear()).catch(()=>{})}}
async function handleScan(txt,at){const raw=String(txt).replace('KIDSCARE:',''),c=db.children.find(c=>c.token===raw||c.id===raw),payload={token:c?c.token:raw,mode:scanMode,scannedAt:at||new Date().toISOString()};
 try{const r=await api.req('/scan',{method:'POST',body:payload});mailToast({to:r.emailedTo,subject:r.subject,body:r.body});
  const bad=x=>x&&x!=='sent'&&x!=='skipped';if(bad(r.emailStatus)||bad(r.smsStatus))toast('Check-in saved. Some notifications are queued and will be retried.','bad')}
 catch(err){if(err.net){await queue('scan','/scan',{json:payload});if(c)c.status=scanMode==='arrival'?'at_school':'home';toast('Offline: scan saved and will sync automatically')}else toast(err.message,'bad')}}
let scanMode='arrival';
function setScan(m){scanMode=m;['arrival','departure'].forEach(k=>$('#sm-'+k).classList.toggle('on',k===m));$('#smhint').textContent='Next scan records a '+(m==='arrival'?'Time In':'Time Out')+'.'}
function renderLog(){const l=$('#log');if(l)l.innerHTML=db.scans.slice(0,8).map(s=>`<div id="scan-${s.id}" class="item flex items-center gap-3 p-2 rounded-lg bg-white/5"><div class="flex-1 min-w-0"><div class="truncate">${s.type==='arrival'?'Time In':'Time Out'} · ${esc(s.name)}</div><div class="text-xs text-slate-400">${new Date(ts(s.created_at)).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${s.email_status==='sent'?'Emailed '+esc(s.parent_email):'Email '+esc(s.email_status||'pending')}</div></div><button class="btn2 btn-danger btn-sm" onclick="delScan(${s.id})">Delete</button></div>`).join('')||'<p class="text-slate-500">No scans yet.</p>'}

let postFiles=[];
function postView(){postFiles=[];return `<div class="grid md:grid-cols-2 gap-4"><div class="glass p-5"><h2 class="font-bold neon mb-3">New activity / announcement</h2>
 <div class="fl"><select id="pk"><option value="activity">Classroom activity</option><option value="announcement">Announcement</option></select><label>Type</label></div>
 ${fl('ptl','Title')}
 <div class="fl"><textarea id="pm" rows="3" placeholder=" "></textarea><label>Message (optional)</label></div>
 <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div class="fl"><select id="pt" onchange="audOpts()"><option value="all">All pupils</option><option value="child">One pupil</option></select><label>Audience</label></div><div class="fl"><select id="pa" onchange="countRecip()"></select><label>Who</label></div></div>
 <label class="block border-2 border-dashed border-amber-400/50 rounded-xl p-4 text-center cursor-pointer hover:bg-amber-400/10 mb-3"><input type="file" accept="image/*" multiple class="hidden" onchange="pickPhotos(this)"><div id="pv">Add photos (optional, up to 5)</div></label>
 <label class="flex items-center gap-3 p-3 rounded-xl bg-white/5 mb-3 cursor-pointer"><input id="pn" type="checkbox" class="w-5 h-5 accent-amber-400"><span class="text-sm">Notify parents by Email and SMS now <span class="text-slate-400">(<b id="rc">0</b> parents)</span></span></label>
 <button class="btn w-full" onclick="sendPost()">Publish</button></div>
 <div class="glass p-5"><h2 class="font-bold neon mb-3">Recent posts</h2><div id="posts" class="space-y-2 text-sm"></div></div></div>`}
function audOpts(){const t=$('#pt'),s=$('#pa');if(!t||!s)return;
 if(t.value==='child')s.innerHTML=db.children.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')||'<option value="">No pupils</option>';
 else s.innerHTML='<option value="">Everyone</option>';
 countRecip()}
function countRecip(){const e=$('#rc');if(!e)return;const t=$('#pt').value,v=$('#pa').value;e.textContent=new Set(db.children.filter(c=>t==='all'||(t==='child'&&c.id===v)).map(c=>c.parentId)).size}
const shrink=f=>new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.8)};im.src=URL.createObjectURL(f)});
async function pickPhotos(inp){postFiles=[];for(const f of [...inp.files].slice(0,5))postFiles.push(await shrink(f));$('#pv').textContent=''+postFiles.length+' photo(s) ready'}
async function sendPost(){if(!chk($('#ptl')))return;
 const f={kind:$('#pk').value,title:$('#ptl').value.trim(),message:$('#pm').value.trim(),targetType:$('#pt').value,targetValue:$('#pa').value,notify:$('#pn').checked?'1':'0'};
 const fd=new FormData();Object.entries(f).forEach(([k,v])=>fd.append(k,v));postFiles.forEach((b,i)=>fd.append('photos',b,'photo'+i+'.jpg'));
 try{const r=await api.req('/activities',{method:'POST',body:fd});toast(r.emailing?'Posted. Notifying '+r.recipients+' parent(s)...':'Posted');setTab('photo')}
 catch(err){if(err.net){await queue('post','/activities',{fields:f,files:postFiles});toast('Offline: post saved and will be published when you are back online');setTab('photo')}else toast(err.message,'bad')}}
async function loadPosts(){try{const l=await api.req('/activities'),b=$('#posts');if(b)b.innerHTML=l.map(a=>`<div id="post-${a.id}" class="item flex items-start gap-3 p-2 rounded-lg bg-white/5"><div class="flex-1 min-w-0"><div class="truncate"><span class="chip mr-1">${a.kind==='announcement'?'Announcement':'Activity'}</span><b>${esc(a.title)}</b></div><div class="text-xs text-slate-400 mt-1">${new Date(ts(a.created_at)).toLocaleString()} · ${a.photos} photo(s) · ${a.notify?'Email '+a.emails_sent+'/'+a.recipients+' sent'+(a.emails_failed?', '+a.emails_failed+' failed':''):'No email'}</div></div><button class="btn2 btn-danger btn-sm" onclick="delPost(${a.id})">Delete</button></div>`).join('')||'<p class="text-slate-500">No posts yet.</p>'}catch(e){}}

function openStudent(id){const c=db.children.find(c=>c.id===id);

 ${sec('Personal details',row('Full name',c.name)+row('Pupil ID',c.code)+row('Age',c.age)+row('Date of birth',c.dob)+row('Address',c.address))}
 ${sec('Parent / guardian',row('Name',c.pname)+row('Gmail',c.pemail)+row('Contact number',c.phone))}
 ${sec('Medical notes',row('Allergies',c.allergies.join(', ')||'None')+row('Medical notes',c.medical))}
 <div class="grid grid-cols-2 gap-2"><button class="btn2" onclick="printQr('${id}')">Print QR</button><button class="btn2 btn-danger" onclick="delStudent('${id}')">Delete pupil</button></div>`)}
function parentsView(){const ps=db.users.filter(u=>u.role==='parent');return `<h2 class="text-lg font-bold neon mb-3">Parents (${ps.length})</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${ps.map(p=>{const kids=db.children.filter(c=>c.parentId===p.id);return `<div id="par-${p.id}" class="glass item p-4 flex flex-col gap-2"><div class="flex items-center gap-3"><div class="avatar">${initials(p.name)}</div><div class="min-w-0"><div class="font-semibold truncate">${esc(p.name)}</div><div class="text-xs text-slate-400 truncate">${esc(p.email)}</div></div></div><div class="text-xs text-slate-300">Children: ${kids.map(c=>esc(c.name)).join(', ')||'None'}</div><div class="mt-auto pt-1"><button class="btn2 btn-danger btn-sm" onclick="delParent('${p.id}')">Delete parent</button></div></div>`}).join('')||'<div class="glass p-8 text-center text-slate-400 sm:col-span-2">No parents registered yet.</div>'}</div>`}

/* ===== Admin: monthly attendance report ===== */
let rpt=null,rptSaved=[];
function reportsView(){const m=new Date().toISOString().slice(0,7);return `<h2 class="text-lg font-bold neon mb-1">Monthly attendance report</h2><p class="text-xs text-slate-400 mb-3">Created automatically on the first morning of each month and emailed to admins and parents. You can also open any month here.</p><div class="flex flex-wrap items-end gap-3 mb-3"><div class="fl !mb-0"><input id="rm" type="month" value="${rpt?rpt.month:m}" placeholder=" "><label>Month</label></div><button class="btn" onclick="loadReport()">Generate</button><button class="btn2" onclick="printReport()">Download PDF</button><button class="btn2" onclick="sendMonthly()">Email this report now</button></div><div id="rsaved" class="mb-3 text-xs text-slate-400"></div><div id="rbox"></div>`}
async function loadReport(){const m=$('#rm');if(!m)return;try{rpt=await api.req('/report?month='+m.value);drawReport();rptSaved=await api.req('/reports');const s=$('#rsaved');if(s)s.innerHTML=rptSaved.length?'Automatic reports: '+rptSaved.map(x=>`<button class="chip cursor-pointer ${x.month===rpt.month?'on':''}" onclick="$('#rm').value='${x.month}';loadReport()">${x.month}</button>`).join(' '):''}catch(e){toast(e.message,'bad')}}
function sendMonthly(){const m=$('#rm').value;askConfirm('Email monthly report','This emails the '+m+' report to all admins and a short summary of each child to their parent.',async()=>{await api.req('/report/run',{method:'POST',body:{month:m}});toast('Sending in the background. See the email log for results.')},'Send')}
const statCard=(k,v)=>`<div class="glass item p-4"><div class="text-xs text-slate-400">${k}</div><div class="text-2xl font-bold neon">${v}</div></div>`;
function drawReport(){const r=rpt,s=r.summary,b=$('#rbox');if(!b)return;
 const list=(a,f)=>a.length?a.map(c=>`<div class="flex justify-between gap-2 py-1 text-sm border-b border-white/5"><span class="truncate">${esc(c.name)}</span><span class="text-slate-400 shrink-0">${f(c)}</span></div>`).join(''):'<p class="text-slate-500 text-sm">None this month.</p>';
 const card=(t,a,f)=>`<div class="glass item p-4"><h3 class="font-bold mb-2">${t}</h3>${list(a,f)}</div>`;
 const d=s.prevAvgRate==null?'':s.avgRate-s.prevAvgRate,trend=d===''?'':`<div class="text-xs font-normal text-slate-400 mt-1">${d>=0?'Up':'Down'} ${Math.abs(d)} pts vs last month</div>`;
 b.innerHTML=`<p class="text-xs text-slate-400 mb-3">${r.schoolDays} school days (Mon-Fri) | Late Time In after ${r.rules.start} | Early Time Out before ${r.rules.end} | Closing ${r.rules.closing}</p>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${statCard('Average attendance',s.avgRate+'%'+trend)}${statCard('Always present',s.perfect)}${statCard('Late arrivals',s.lates)}${statCard('Absent days (total)',s.absences)}</div>
 <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 mb-4">${card('Always present',r.perfect,c=>esc(c.code))}${card('Frequent lates',r.lates,c=>c.late+' days')}${card('Frequent early pickups',r.early,c=>c.early+' days')}${card('Needs follow-up (absences)',r.absent,c=>c.absent+' absent'+(c.maxAbsentStreak>1?', '+c.maxAbsentStreak+' in a row':''))}${card('Late pickups (after '+r.rules.closing+')',r.latePickups,c=>c.latePickup+' days')}${card('Missing Time Out scan',r.missingOut,c=>c.missingOut+' days')}</div>
 <div class="glass p-4 mb-4"><h3 class="font-bold mb-3">Daily attendance</h3><div class="flex items-end gap-1 h-28">${r.daily.map(x=>`<div class="flex-1 h-full flex flex-col justify-end items-center" title="${x.date}: ${x.present}"><div class="w-full rounded-t bg-gradient-to-t from-amber-500 to-pink-500" style="height:${s.students?Math.max(3,x.present/s.students*100):3}%"></div><span class="text-[9px] text-slate-500">${x.date.slice(8)}</span></div>`).join('')||'<p class="text-slate-500 text-sm">No school days yet.</p>'}</div></div>
 <div class="glass p-4 overflow-x-auto"><h3 class="font-bold mb-2">Days attended per child</h3><table class="w-full text-sm whitespace-nowrap"><tr class="text-left text-slate-400"><th class="py-1">Pupil</th><th>ID</th><th>Present</th><th>Absent</th><th>Late</th><th>Early</th><th>Avg stay</th><th>Rate</th></tr>${r.children.map(c=>`<tr class="border-t border-white/5"><td class="py-1 pr-3">${esc(c.name)}</td><td class="pr-3">${esc(c.code)}</td><td>${c.present}</td><td>${c.absent}</td><td>${c.late}</td><td>${c.early}</td><td>${c.avgStay?c.avgStay+' h':'-'}</td><td>${c.rate}%</td></tr>`).join('')}</table></div>`}
function printReport(){if(!rpt)return toast('Generate a report first','bad');const r=rpt,s=r.summary;
 const tb=(h,rows)=>`<table style="width:100%;border-collapse:collapse;font:13px sans-serif;margin:6px 0 16px"><tr>${h.map(x=>`<th style="text-align:left;border-bottom:2px solid #333;padding:4px">${x}</th>`).join('')}</tr>${rows.map(c=>`<tr>${c.map(x=>`<td style="border-bottom:1px solid #ddd;padding:4px">${esc(x)}</td>`).join('')}</tr>`).join('')||'<tr><td style="padding:4px">None</td></tr>'}</table>`;
 $('#printArea').innerHTML=`<div style="text-align:left;font-family:sans-serif;color:#000"><h1 style="margin:0">KidsCare Monthly Attendance Report</h1><p style="margin:4px 0 14px">${esc(r.month)} | ${r.schoolDays} school days (Mon-Fri) | Late Time In after ${r.rules.start} | Early Time Out before ${r.rules.end} | Closing ${r.rules.closing}</p>
 <h3>Summary</h3>${tb(['Pupils','Average attendance','Always present','Late arrivals','Early pickups','Late pickups','Absent days'],[[s.students,s.avgRate+'%',s.perfect,s.lates,s.early,s.latePickups,s.absences]])}
 <h3>Always present</h3>${tb(['Pupil','ID'],r.perfect.map(c=>[c.name,c.code]))}
 <h3>Frequent lates</h3>${tb(['Pupil','Late days'],r.lates.map(c=>[c.name,c.late]))}
 <h3>Frequent early pickups</h3>${tb(['Pupil','Early days'],r.early.map(c=>[c.name,c.early]))}
 <h3>Needs follow-up (absences)</h3>${tb(['Pupil','Absent days','Longest streak'],r.absent.map(c=>[c.name,c.absent,c.maxAbsentStreak]))}
 <h3>Late pickups</h3>${tb(['Pupil','Days'],r.latePickups.map(c=>[c.name,c.latePickup]))}
 <h3>Days attended per child</h3>${tb(['Pupil','ID','Present','Absent','Late','Early','Avg stay','Rate'],r.children.map(c=>[c.name,c.code,c.present,c.absent,c.late,c.early,c.avgStay?c.avgStay+' h':'-',c.rate+'%']))}</div>`;setTimeout(()=>window.print(),100)}

/* ===== Delete actions (with confirmation) ===== */
let _yes=null;
function askConfirm(title,msg,fn,label='Delete',body=''){_yes=fn;$('#modal').innerHTML=`<div class="modal-bg fixed inset-0 z-50 grid place-items-center p-4 bg-black/70 backdrop-blur-sm" onclick="if(event.target===this)closeModal()"><div class="glass fade p-5 w-full max-w-sm !bg-slate-900/90"><h3 class="font-bold text-lg mb-1">${esc(title)}</h3>${body||`<p class="text-sm text-slate-300 mb-5">${esc(msg)}</p>`}<div class="flex flex-wrap gap-2 justify-end"><button class="btn2" onclick="closeModal()">Cancel</button><button class="btn ${label==='Delete'||label==='Remove'?'btn-solid-danger':''}" onclick="doYes()">${esc(label)}</button></div></div></div>`}
async function doYes(){const f=_yes;_yes=null;closeModal();if(!f)return;try{await f()}catch(err){toast(err.message,'bad')}}
const gone=async sel=>{const el=document.querySelector(sel);if(el){el.classList.add('leaving');await new Promise(r=>setTimeout(r,260))}};
const del=(path,sel,ok,after)=>async()=>{await api.req(path,{method:'DELETE'});await gone(sel);await refresh();(after||view)();toast(ok)};
function delScan(id){askConfirm('Delete check-in','This removes the entry from the log. The pupil status is recalculated from the remaining check-ins.',del('/scans/'+id,'#scan-'+id,'Check-in deleted',renderLog))}
function delPost(id){askConfirm('Delete post','This removes the post and its photos for every parent.',async()=>{await api.req('/activities/'+id,{method:'DELETE'});await gone('#post-'+id);await loadPosts();toast('Post deleted')})}
function delStudent(id){const c=db.children.find(c=>c.id===id);askConfirm('Delete pupil','Permanently deletes '+c.name+', the QR pass and the check-in history. This cannot be undone.',del('/children/'+id,'.stu[data-id="'+id+'"]','Pupil deleted'))}
function delChild(id){const c=db.children.find(c=>c.id===id);askConfirm('Remove child','This removes '+c.name+' and the QR pass from your account. This cannot be undone.',del('/children/'+id,'#kid-'+id,'Child removed'))}
function delParent(id){const p=db.users.find(u=>u.id===id),n=db.children.filter(c=>c.parentId===id).length;askConfirm('Delete parent','Deletes the account of '+p.name+(n?', '+n+' linked child record(s)':'')+' and the chat history. This cannot be undone.',del('/parents/'+id,'#par-'+id,'Parent deleted'))}
function hideUpdate(id){askConfirm('Remove update','This removes the update from your feed only. Other parents can still see it.',del('/feed/'+id,'#feed-'+id,'Update removed'),'Remove')}

/* ===== Start ===== */
window.addEventListener('online',()=>{netUI();flush()});window.addEventListener('offline',netUI);
setInterval(()=>{netUI();flush()},20000);
